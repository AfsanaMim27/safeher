name: safeher
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.31.8
  # Firebase (Dart 3 compatible)
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

  # Location & Maps
  geolocator: ^14.0.2
   # For opening SMS app with pre-filled message
  url_launcher: ^6.2.1
  
  # For sending SMS directly (Android only, requires permissions)
  flutter_sms: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
